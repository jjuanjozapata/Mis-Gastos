<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; connect-src 'self' https://znszebnjcgjfzxvnexxd.supabase.co; img-src 'self' data: https://cdn-icons-png.flaticon.com;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WZ Finanzas</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { padding-bottom: env(safe-area-inset-bottom); height: 100dvh; }
        button { touch-action: manipulation; }
        .tab-activa { color: #34d399; }
        .tab-inactiva { color: #64748b; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col font-sans select-none overflow-hidden relative">
    
    <!-- MODAL OTROS GASTOS (Fijo y por encima de todo) -->
    <div id="modal-notas" class="hidden fixed inset-0 z-[100] bg-slate-950/95 backdrop-blur-xl justify-center items-center p-6">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-700 shadow-2xl">
            <h3 class="text-xl font-bold text-white mb-2">Detalle del gasto</h3>
            <p class="text-slate-400 text-sm mb-5">Escribe brevemente en qué gastaste este dinero.</p>
            <input type="text" id="input-notas" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-4 text-white focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 mb-6 text-lg" placeholder="Ej. Helado, Cine, Pasajes..." autocomplete="off">
            <div class="flex gap-3">
                <button onclick="cerrarModal()" class="flex-1 py-4 rounded-xl bg-slate-700 text-white font-bold active:bg-slate-600 transition-colors">Cancelar</button>
                <button onclick="confirmarOtrosGastos()" class="flex-1 py-4 rounded-xl bg-emerald-500 text-slate-900 font-bold active:bg-emerald-400 transition-colors">Guardar</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA 1: CAPTURA RÁPIDA -->
    <div id="pantalla-captura" class="flex-1 flex flex-col min-h-0 relative">
        <header class="shrink-0 p-5 flex justify-between items-center border-b border-slate-800">
            <span id="fecha-actual" class="text-slate-400 font-medium"></span>
            <span class="bg-slate-800 text-emerald-400 px-3 py-1 rounded-full text-sm font-semibold tracking-wide">Nequi</span>
        </header>

        <div class="shrink-0 flex flex-col justify-center items-center py-4">
            <span class="text-slate-500 text-sm mb-1">Ingresar gasto</span>
            <div id="monto-display" class="text-6xl font-bold tracking-tighter text-white transition-colors">$ 0</div>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar px-4 pb-2" id="categorias-wrapper">
            <div class="grid grid-cols-4 gap-2" id="categorias-container"></div>
        </div>

        <div class="shrink-0 grid grid-cols-3 gap-2 p-3 bg-slate-950 rounded-t-3xl shadow-[0_-15px_30px_rgba(0,0,0,0.6)]">
            <button onclick="digitar('1')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">1</button>
            <button onclick="digitar('2')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">2</button>
            <button onclick="digitar('3')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">3</button>
            <button onclick="digitar('4')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">4</button>
            <button onclick="digitar('5')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">5</button>
            <button onclick="digitar('6')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">6</button>
            <button onclick="digitar('7')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">7</button>
            <button onclick="digitar('8')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">8</button>
            <button onclick="digitar('9')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">9</button>
            <button onclick="limpiar()" class="py-3 text-lg font-bold text-red-400 bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">C</button>
            <button onclick="digitar('0')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">0</button>
            <button onclick="borrar()" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">⌫</button>
        </div>
    </div>

    <!-- PANTALLA 2: DASHBOARD -->
    <div id="pantalla-dashboard" class="flex-1 hidden flex-col h-full overflow-y-auto bg-slate-900 min-h-0">
        <div class="p-6 pb-12">
            <h2 class="text-2xl font-bold text-white mb-6">Resumen Mensual</h2>
            <div class="bg-slate-800 rounded-2xl p-5 mb-6 border border-slate-700">
                <p class="text-slate-400 text-sm font-medium">Total Gastado este Mes</p>
                <h3 id="dash-total-gastado" class="text-4xl font-bold text-red-400 mt-1">$ 0</h3>
            </div>
            <div class="bg-slate-800 rounded-2xl p-5 mb-6 border border-slate-700">
                <p class="text-slate-200 text-sm font-semibold mb-4">Distribución</p>
                <canvas id="graficoCategorias" height="250"></canvas>
            </div>
            <div id="lista-presupuestos" class="space-y-4"></div>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav class="shrink-0 w-full bg-slate-950 border-t border-slate-800 flex justify-around items-center h-[65px]">
        <button onclick="cambiarTab('captura')" id="tab-captura" class="flex flex-col items-center justify-center w-full h-full tab-activa transition-colors">
            <span class="text-xl mb-1">⌨️</span>
            <span class="text-[10px] font-bold">Ingresar</span>
        </button>
        <button onclick="cambiarTab('dashboard')" id="tab-dashboard" class="flex flex-col items-center justify-center w-full h-full tab-inactiva transition-colors">
            <span class="text-xl mb-1">📊</span>
            <span class="text-[10px] font-bold">Reportes</span>
        </button>
    </nav>

    <script>
        const db = supabase.createClient(
            'https://znszebnjcgjfzxvnexxd.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpuc3plYm5qY2dqZnp4dm5leHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NzkwNzcsImV4cCI6MjEwNTQ1NTA3N30.Od66KMiiuXPrzAUfuiprc7Q7SF3909lxDeBevMK25h0'
        );
        // Disparador automático cuando el iPhone recupera la red
window.addEventListener('online', procesarColaOffline);

async function procesarColaOffline() {
    let queue = JSON.parse(localStorage.getItem('offline_queue') || '[]');
    if (queue.length === 0) return;

    // Inserción masiva optimizada
    const { error } = await db.from('transacciones').insert(queue);
    
    if (!error) {
        localStorage.removeItem('offline_queue');
        console.log(`Sincronizadas ${queue.length} transacciones pendientes.`);
        if (!document.getElementById('pantalla-dashboard').classList.contains('hidden')) {
            cargarEstadisticas();
        }
    }
}

// Ejecutar revisión inicial al abrir la app
if (navigator.onLine) procesarColaOffline();

        const formateador = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
        let monto = '0';
        let graficoInstancia = null;
        let categoriaPendiente = null;

        document.getElementById('fecha-actual').textContent = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'short' }).format(new Date());

        function cambiarTab(pantalla) {
            const captura = document.getElementById('pantalla-captura');
            const dashboard = document.getElementById('pantalla-dashboard');
            const tabCap = document.getElementById('tab-captura');
            const tabDash = document.getElementById('tab-dashboard');

            if (pantalla === 'captura') {
                captura.classList.remove('hidden'); captura.classList.add('flex');
                dashboard.classList.add('hidden'); dashboard.classList.remove('flex');
                tabCap.classList.replace('tab-inactiva', 'tab-activa'); tabDash.classList.replace('tab-activa', 'tab-inactiva');
            } else {
                dashboard.classList.remove('hidden'); dashboard.classList.add('flex');
                captura.classList.add('hidden'); captura.classList.remove('flex');
                tabDash.classList.replace('tab-inactiva', 'tab-activa'); tabCap.classList.replace('tab-activa', 'tab-inactiva');
                cargarEstadisticas();
            }    
             
        }

        function actualizarPantalla() { document.getElementById('monto-display').textContent = formateador.format(parseInt(monto || '0')); }
        function digitar(num) { if (monto === '0' || monto === 0) monto = num; else if (monto.length < 10) monto += num; actualizarPantalla(); }
        function borrar() { monto = monto.slice(0, -1); if (monto === '') monto = '0'; actualizarPantalla(); }
        function limpiar() { monto = '0'; actualizarPantalla(); }

        async function cargarCategorias() {
    const { data, error } = await db.from('categorias').select('*').eq('tipo', 'gasto').order('nombre');
    if (error) return console.error(error);
    
    const contenedor = document.getElementById('categorias-container');
    contenedor.innerHTML = ''; // Aquí es seguro limpiar
    
    data.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = "flex flex-col items-center justify-center py-2 bg-slate-800 rounded-xl active:bg-emerald-600 active:scale-95 transition-all border border-slate-700 min-h-[70px]";
        
        const spanIcono = document.createElement('span');
        spanIcono.className = "text-xl mb-1";
        spanIcono.textContent = cat.icono; // Seguro contra XSS
        
        const spanNombre = document.createElement('span');
        spanNombre.className = "text-[8px] font-bold text-slate-300 uppercase tracking-wider text-center px-1 leading-tight";
        spanNombre.textContent = cat.nombre; // Seguro contra XSS
        
        btn.appendChild(spanIcono);
        btn.appendChild(spanNombre);
        
        btn.onclick = () => {
            if (parseInt(monto) > 0) {
                if (cat.nombre.toUpperCase().includes('OTROS')) {
                    abrirModal(cat.id);
                } else {
                    guardarTransaccion(cat.id, '');
                }
            }
        };
        contenedor.appendChild(btn);
    });
}

        function abrirModal(catId) {
            categoriaPendiente = catId;
            const modal = document.getElementById('modal-notas');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('input-notas').focus();
        }

        function cerrarModal() {
            const modal = document.getElementById('modal-notas');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('input-notas').value = '';
            categoriaPendiente = null;
        }

        function confirmarOtrosGastos() {
            const nota = document.getElementById('input-notas').value.trim();
            guardarTransaccion(categoriaPendiente, nota);
            cerrarModal();
        }

        async function guardarTransaccion(categoriaId, notaGasto) {
            const valorGasto = parseInt(monto);
            if (valorGasto === 0) return;

            const payload = { 
                monto: valorGasto, 
                categoria_id: categoriaId, 
                cuenta: 'Nequi', 
                fecha: new Date().toISOString(),
                notas: notaGasto || null 
            };
            
            const display = document.getElementById('monto-display');

            if (navigator.onLine) {
                const { error } = await db.from('transacciones').insert([payload]);
                if (error) {
                    display.style.color = '#ef4444'; 
                    setTimeout(() => display.style.color = 'white', 1000);
                    return;
                }
            } else {
                let queue = JSON.parse(localStorage.getItem('offline_queue') || '[]');
                queue.push(payload);
                localStorage.setItem('offline_queue', JSON.stringify(queue));
            }
            
            if (navigator.vibrate) navigator.vibrate(50);
            display.style.color = '#34d399'; 
            setTimeout(() => display.style.color = 'white', 300);
            limpiar();
        }

        async function cargarEstadisticas() {
            const fecha = new Date();
            const inicioDeMes = `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}-01`;

            const { data: categorias, error: errCat } = await db.from('categorias').select('*').eq('tipo', 'gasto');
            const { data: transacciones, error: errTrans } = await db.from('transacciones').select('*').gte('fecha', inicioDeMes);
            
            if (errCat || errTrans) return console.error("Error BD:", errCat, errTrans);

            let totalGastadoMes = 0;
            const reporte = {};
            
            categorias.forEach(c => { reporte[c.id] = { nombre: c.nombre, presupuesto: parseFloat(c.presupuesto_mensual) || 0, gastado: 0 }; });
            transacciones.forEach(t => {
                if (reporte[t.categoria_id]) {
                    const valor = parseFloat(t.monto);
                    reporte[t.categoria_id].gastado += valor;
                    totalGastadoMes += valor;
                }
            });

            const labelsGrafico = [];
            const dataGrafico = [];
            const contenedorLista = document.getElementById('lista-presupuestos');
            contenedorLista.innerHTML = '';

            if (totalGastadoMes === 0) {
                document.getElementById('dash-total-gastado').textContent = '$ 0';
                renderizarGraficoDonut(['Sin datos'], [1]);
                return;
            }

            Object.values(reporte).sort((a,b) => b.gastado - a.gastado).forEach(item => {
                if (item.gastado > 0) { labelsGrafico.push(item.nombre); dataGrafico.push(item.gastado); }
                const porcentaje = item.presupuesto > 0 ? Math.min((item.gastado / item.presupuesto) * 100, 100).toFixed(0) : 0;
                const colorBarra = porcentaje > 90 ? 'bg-red-500' : (porcentaje > 70 ? 'bg-yellow-400' : 'bg-emerald-400');

                if (item.gastado > 0 || item.presupuesto > 0) {
                    contenedorLista.innerHTML += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-4">
                            <div class="flex justify-between items-end mb-2">
                                <span class="font-bold text-white uppercase text-xs tracking-wider">${item.nombre}</span>
                                <span class="text-xs text-slate-400">${formateador.format(item.gastado)} de ${formateador.format(item.presupuesto)}</span>
                            </div>
                            <div class="w-full bg-slate-900 rounded-full h-2.5">
                                <div class="${colorBarra} h-2.5 rounded-full transition-all duration-1000" style="width: ${porcentaje}%"></div>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById('dash-total-gastado').textContent = formateador.format(totalGastadoMes);
            renderizarGraficoDonut(labelsGrafico, dataGrafico);
        }

        function renderizarGraficoDonut(labels, data) {
            const ctx = document.getElementById('graficoCategorias').getContext('2d');
            if (graficoInstancia) graficoInstancia.destroy();
            graficoInstancia = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#c084fc', '#a3e635', '#f472b6', '#38bdf8', '#a78bfa', '#fb923c', '#4ade80', '#94a3b8'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: { responsive: true, cutout: '75%', plugins: { legend: { position: 'right', labels: { color: '#cbd5e1', font: { size: 9 } } } } }
            });
        }
        
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        cargarCategorias();
    </script>
</body>
</html>
