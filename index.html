<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WZ Finanzas</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        button { touch-action: manipulation; }
        .tab-activa { color: #34d399; }
        .tab-inactiva { color: #64748b; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans select-none pb-16">
    
    <!-- PANTALLA 1: CAPTURA RÁPIDA -->
    <div id="pantalla-captura" class="flex-1 flex flex-col h-full">
        <header class="p-6 flex justify-between items-center border-b border-slate-800">
            <span id="fecha-actual" class="text-slate-400 font-medium"></span>
            <span class="bg-slate-800 text-emerald-400 px-3 py-1 rounded-full text-sm font-semibold tracking-wide">Nequi</span>
        </header>

        <div class="flex-1 flex flex-col justify-center items-center p-6">
            <span class="text-slate-500 text-lg mb-2">Ingresar gasto</span>
            <div id="monto-display" class="text-6xl font-bold tracking-tighter text-white transition-colors">$ 0</div>
        </div>

        <div class="grid grid-cols-4 gap-2 px-4 pb-4" id="categorias-container">
            <!-- Botones inyectados desde BD -->
        </div>

        <div class="grid grid-cols-3 gap-2 p-4 bg-slate-950 rounded-t-3xl shadow-2xl shadow-black">
            <button onclick="digitar('1')" class="py-5 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">1</button>
            <button onclick="digitar('2')" class="py-5 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">2</button>
            <button onclick="digitar('3')" class="py-5 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">3</button>
            <button onclick="digitar('4')" class="py-5 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">4</button>
            <button onclick="digitar('5')" class="py-5 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">5</button>
            <button onclick="digitar('6')" class="py-5 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">6</button>
            <button onclick="digitar('7')" class="py-5 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">7</button>
            <button onclick="digitar('8')" class="py-5 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">8</button>
            <button onclick="digitar('9')" class="py-5 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">9</button>
            <button onclick="limpiar()" class="py-5 text-lg font-medium text-red-400 bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">C</button>
            <button onclick="digitar('0')" class="py-5 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">0</button>
            <button onclick="borrar()" class="py-5 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">⌫</button>
        </div>
    </div>

    <!-- PANTALLA 2: DASHBOARD Y ESTADÍSTICAS -->
    <div id="pantalla-dashboard" class="flex-1 hidden flex-col h-full overflow-y-auto bg-slate-900 pb-8">
        <div class="p-6">
            <h2 class="text-2xl font-bold text-white mb-6">Resumen Mensual</h2>
            
            <!-- Resumen Total -->
            <div class="bg-slate-800 rounded-2xl p-5 mb-6 border border-slate-700">
                <p class="text-slate-400 text-sm font-medium">Total Gastado este Mes</p>
                <h3 id="dash-total-gastado" class="text-4xl font-bold text-red-400 mt-1">$ 0</h3>
            </div>

            <!-- Gráfico de Donut -->
            <div class="bg-slate-800 rounded-2xl p-5 mb-6 border border-slate-700">
                <p class="text-slate-200 text-sm font-semibold mb-4">Distribución por Categoría</p>
                <canvas id="graficoCategorias" height="250"></canvas>
            </div>
            
            <!-- Lista de Presupuestos -->
            <div id="lista-presupuestos" class="space-y-4">
                <!-- Se inyecta desde la base de datos -->
            </div>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR (IOS STYLE) -->
    <nav class="fixed bottom-0 w-full bg-slate-950 border-t border-slate-800 flex justify-around items-center h-16 pb-safe">
        <button onclick="cambiarTab('captura')" id="tab-captura" class="flex flex-col items-center justify-center w-full h-full tab-activa transition-colors">
            <span class="text-2xl mb-1">⌨️</span>
            <span class="text-[10px] font-bold">Ingresar</span>
        </button>
        <button onclick="cambiarTab('dashboard')" id="tab-dashboard" class="flex flex-col items-center justify-center w-full h-full tab-inactiva transition-colors">
            <span class="text-2xl mb-1">📊</span>
            <span class="text-[10px] font-bold">Reportes</span>
        </button>
    </nav>

    <script>
        // --- 1. CONFIGURACIÓN Y CREDENCIALES ---
        const supabaseUrl = 'https://znszebnjcgjfzxvnexxd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpuc3plYm5qY2dqZnp4dm5leHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NzkwNzcsImV4cCI6MjEwNTQ1NTA3N30.Od66KMiiuXPrzAUfuiprc7Q7SF3909lxDeBevMK25h0';
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        const formateador = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
        let monto = '0';
        let graficoInstancia = null;

        document.getElementById('fecha-actual').textContent = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'short' }).format(new Date());

        // --- 2. LÓGICA DE NAVEGACIÓN ---
        function cambiarTab(pantalla) {
            const captura = document.getElementById('pantalla-captura');
            const dashboard = document.getElementById('pantalla-dashboard');
            const tabCap = document.getElementById('tab-captura');
            const tabDash = document.getElementById('tab-dashboard');

            if (pantalla === 'captura') {
                captura.classList.remove('hidden');
                captura.classList.add('flex');
                dashboard.classList.add('hidden');
                dashboard.classList.remove('flex');
                tabCap.classList.replace('tab-inactiva', 'tab-activa');
                tabDash.classList.replace('tab-activa', 'tab-inactiva');
            } else {
                dashboard.classList.remove('hidden');
                dashboard.classList.add('flex');
                captura.classList.add('hidden');
                captura.classList.remove('flex');
                tabDash.classList.replace('tab-inactiva', 'tab-activa');
                tabCap.classList.replace('tab-activa', 'tab-inactiva');
                cargarEstadisticas(); // Dispara la consulta al cambiar de pestaña
            }
        }

        // --- 3. LÓGICA DEL TECLADO (CAPTURAR DATOS) ---
        function actualizarPantalla() {
            document.getElementById('monto-display').textContent = formateador.format(parseInt(monto || '0'));
        }
        function digitar(num) {
            if (monto === '0' || monto === 0) monto = num;
            else if (monto.length < 10) monto += num;
            actualizarPantalla();
        }
        function borrar() {
            monto = monto.slice(0, -1);
            if (monto === '') monto = '0';
            actualizarPantalla();
        }
        function limpiar() {
            monto = '0';
            actualizarPantalla();
        }

        async function cargarCategorias() {
            const { data, error } = await db.from('categorias').select('*').eq('tipo', 'gasto');
            if (error) return console.error("Fallo cargando categorías:", error);
            
            const contenedor = document.getElementById('categorias-container');
            contenedor.innerHTML = ''; // Limpiar
            data.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "flex flex-col items-center justify-center py-3 bg-slate-800 rounded-xl active:bg-blue-600 active:scale-95 transition-all border border-slate-700";
                btn.innerHTML = `<span class="text-2xl mb-1">${cat.icono}</span><span class="text-[10px] font-bold text-slate-300 uppercase tracking-wider">${cat.nombre}</span>`;
                btn.onclick = () => guardarTransaccion(cat.id);
                contenedor.appendChild(btn);
            });
        }

        // --- 1. VERSIÓN BLINDADA DEL GUARDADO ---
        async function guardarTransaccion(categoriaId) {
            const valorGasto = parseInt(monto);
            if (valorGasto === 0) return;

            const payload = { monto: valorGasto, categoria_id: categoriaId, cuenta: 'Nequi', fecha: new Date().toISOString() };

            if (navigator.onLine) {
                const { error } = await db.from('transacciones').insert([payload]);
                if (error) {
                    console.error("Fallo guardando en DB:", error);
                    // Si hay error, el texto se pone rojo un segundo y NO limpia la pantalla
                    const display = document.getElementById('monto-display');
                    display.style.color = '#ef4444'; 
                    setTimeout(() => display.style.color = 'white', 1000);
                    return; 
                } else {
                    vibrarExito();
                    limpiar(); // Solo limpia si fue exitoso
                }
            } else {
                let queue = JSON.parse(localStorage.getItem('offline_queue') || '[]');
                queue.push(payload);
                localStorage.setItem('offline_queue', JSON.stringify(queue));
                vibrarExito();
                limpiar();
            }
        }

        // --- 2. VERSIÓN BLINDADA DEL DASHBOARD (INMUNE A ZONAS HORARIAS) ---
        async function cargarEstadisticas() {
            const fechaActual = new Date();
            // Fuerza la búsqueda con texto puro (Ej. "2026-09-01") evadiendo el desfase UTC-5 de Colombia
            const primerDiaMes = `${fechaActual.getFullYear()}-${String(fechaActual.getMonth() + 1).padStart(2, '0')}-01`;
            
            const { data, error } = await db.from('reporte_mensual')
                .select('*')
                .gte('mes', primerDiaMes)
                .eq('tipo', 'gasto');

            if (error) return console.error("Error trayendo estadísticas:", error);

            let totalGastadoMes = 0;
            const labelsGrafico = [];
            const dataGrafico = [];
            const contenedorLista = document.getElementById('lista-presupuestos');
            contenedorLista.innerHTML = ''; // Limpia lista anterior

            // Si no hay datos, mostramos 0
            if (!data || data.length === 0) {
                document.getElementById('dash-total-gastado').textContent = '$ 0';
                renderizarGraficoDonut(['Sin datos'], [1]); // Gráfico vacío representativo
                return;
            }

            data.forEach(item => {
                totalGastadoMes += parseFloat(item.total_gastado);
                labelsGrafico.push(item.categoria);
                dataGrafico.push(item.total_gastado);

                // Calcular progreso
                const porcentaje = Math.min((item.total_gastado / item.presupuesto_mensual) * 100, 100).toFixed(0);
                const colorBarra = porcentaje > 90 ? 'bg-red-500' : (porcentaje > 70 ? 'bg-yellow-400' : 'bg-emerald-400');

                contenedorLista.innerHTML += `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-4">
                        <div class="flex justify-between items-end mb-2">
                            <span class="font-bold text-white">${item.categoria}</span>
                            <span class="text-xs text-slate-400">${formateador.format(item.total_gastado)} de ${formateador.format(item.presupuesto_mensual)}</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-2.5">
                            <div class="${colorBarra} h-2.5 rounded-full transition-all duration-1000" style="width: ${porcentaje}%"></div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('dash-total-gastado').textContent = formateador.format(totalGastadoMes);
            renderizarGraficoDonut(labelsGrafico, dataGrafico);
        }

        function vibrarExito() {
            if (navigator.vibrate) navigator.vibrate(50);
            const display = document.getElementById('monto-display');
            display.style.color = '#34d399'; 
            setTimeout(() => display.style.color = 'white', 300);
        }

        // --- 4. LÓGICA DEL DASHBOARD (GRÁFICAS) ---
        async function cargarEstadisticas() {
            // Obtenemos el mes actual para filtrar
            const fechaActual = new Date();
            const primerDiaMes = new Date(fechaActual.getFullYear(), fechaActual.getMonth(), 1).toISOString();
            
            // Llama a la vista SQL que creaste en la Fase 3
            const { data, error } = await db.from('reporte_mensual')
                .select('*')
                .gte('mes', primerDiaMes)
                .eq('tipo', 'gasto');

            if (error) return console.error("Error trayendo estadísticas:", error);

            let totalGastadoMes = 0;
            const labelsGrafico = [];
            const dataGrafico = [];
            const contenedorLista = document.getElementById('lista-presupuestos');
            contenedorLista.innerHTML = '';

            data.forEach(item => {
                totalGastadoMes += parseFloat(item.total_gastado);
                labelsGrafico.push(item.categoria);
                dataGrafico.push(item.total_gastado);

                // Calcular progreso
                const porcentaje = Math.min((item.total_gastado / item.presupuesto_mensual) * 100, 100).toFixed(0);
                const colorBarra = porcentaje > 90 ? 'bg-red-500' : (porcentaje > 70 ? 'bg-yellow-400' : 'bg-emerald-400');

                contenedorLista.innerHTML += `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                        <div class="flex justify-between items-end mb-2">
                            <span class="font-bold text-white">${item.categoria}</span>
                            <span class="text-xs text-slate-400">${formateador.format(item.total_gastado)} de ${formateador.format(item.presupuesto_mensual)}</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-2.5">
                            <div class="${colorBarra} h-2.5 rounded-full transition-all duration-1000" style="width: ${porcentaje}%"></div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('dash-total-gastado').textContent = formateador.format(totalGastadoMes);
            renderizarGraficoDonut(labelsGrafico, dataGrafico);
        }

        function renderizarGraficoDonut(labels, data) {
            const ctx = document.getElementById('graficoCategorias').getContext('2d');
            
            if (graficoInstancia) graficoInstancia.destroy(); // Destruye el viejo antes de repintar

            graficoInstancia = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#c084fc', '#a3e635'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    cutout: '75%',
                    plugins: {
                        legend: { position: 'right', labels: { color: '#cbd5e1', font: { size: 11 } } }
                    }
                }
            });
        }

        // --- INIT ---
        cargarCategorias();
    </script>
</body>
</html>
