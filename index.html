<body class="bg-slate-900 text-slate-100 flex flex-col font-sans select-none overflow-hidden relative">
    
    <!-- MODAL OTROS GASTOS -->
    <div id="modal-notas" class="hidden fixed inset-0 z-[100] bg-slate-950/95 backdrop-blur-xl justify-center items-center p-6">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-700 shadow-2xl">

    <!-- PANTALLA 1: CAPTURA RÁPIDA -->
    <div id="pantalla-captura" class="flex-1 flex flex-col min-h-0 relative">
        <header class="shrink-0 p-5 flex justify-between items-center border-b border-slate-800">
            <div class="flex gap-1 bg-slate-800 p-1 rounded-xl">
                <button id="btn-tipo-gasto" onclick="cambiarTipoTransaccion('gasto')" class="bg-slate-600 text-white px-4 py-1 rounded-lg text-xs font-bold transition-all shadow-md">GASTO</button>
                <button id="btn-tipo-ingreso" onclick="cambiarTipoTransaccion('ingreso')" class="text-slate-400 px-4 py-1 rounded-lg text-xs font-bold transition-all">INGRESO</button>
            </div>
            <button onclick="cambiarCuenta()" id="btn-cuenta" class="bg-slate-800 text-emerald-400 border border-emerald-500/30 px-4 py-1.5 rounded-full text-sm font-semibold tracking-wide active:scale-95 transition-all">Nequi</button>
        </header>

        <div class="shrink-0 flex flex-col justify-center items-center py-4">
            <span id="fecha-actual" class="text-slate-500 text-sm mb-1 font-medium"></span>
            <div id="monto-display" class="text-6xl font-bold tracking-tighter text-white transition-colors">$ 0</div>

        <div class="flex-1 overflow-y-auto no-scrollbar px-4 pb-2" id="categorias-wrapper">

        <div class="shrink-0 grid grid-cols-3 gap-2 p-3 bg-slate-950 rounded-t-3xl shadow-[0_-15px_30px_rgba(0,0,0,0.6)]">

            <button onclick="digitar('2')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">2</button>
            <button onclick="digitar('3')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">3</button>
            <button onclick="digitar('4')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">4</button>
            <button onclick="digitar('5')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">5</button>
            <button onclick="digitar('6')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">6</button>
            <button onclick="digitar('7')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">7</button>
            <button onclick="digitar('8')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">8</button>

            <button onclick="digitar('0')" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">0</button>
            <button onclick="borrar()" class="py-3 text-2xl font-medium bg-slate-800 rounded-xl active:bg-slate-700 active:scale-95 transition-all">⌫</button>

    <!-- PANTALLA 2: DASHBOARD -->
    <div id="pantalla-dashboard" class="flex-1 hidden flex-col h-full overflow-y-auto bg-slate-900 min-h-0">
        <div class="p-6 pb-12">
            
            <!-- FILTRO DE TIEMPO -->
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">Flujo de Caja</h2>
                <select id="filtro-tiempo" onchange="cargarEstadisticas()" class="bg-slate-800 text-slate-300 text-sm rounded-lg px-3 py-1.5 border border-slate-700 outline-none">
                    <option value="dia">Hoy</option>
                    <option value="mes" selected>Este Mes</option>
                    <option value="anio">Este Año</option>
                </select>
            </div>
            
            <div class="bg-slate-800 rounded-3xl p-5 mb-6 border border-slate-700 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full blur-3xl"></div>
                <p class="text-slate-400 text-sm font-medium relative z-10">Balance Disponible</p>
                <h3 id="dash-balance" class="text-4xl font-bold text-white mt-1 relative z-10">$ 0</h3>
                
                <div class="grid grid-cols-2 gap-4 mt-6 relative z-10 border-t border-slate-700 pt-4">
                    <div>
                        <p class="text-slate-500 text-xs font-medium mb-1">Ingresos</p>
                        <p id="dash-ingresos" class="text-lg font-bold text-emerald-400">$ 0</p>
                    </div>
                    <div>
                        <p class="text-slate-500 text-xs font-medium mb-1">Gastos</p>
                        <p id="dash-gastos" class="text-lg font-bold text-red-400">$ 0</p>
                    </div>
                </div>
            </div>

            <!-- HISTORIAL RECIENTE -->
            <div class="bg-slate-800 rounded-3xl p-5 mb-6 border border-slate-700">
                <p class="text-slate-200 text-sm font-semibold mb-4">Últimos Movimientos</p>
                <div id="historial-transacciones" class="space-y-3"></div>
            </div>

            <div class="bg-slate-800 rounded-3xl p-5 mb-6 border border-slate-700">
                <p class="text-slate-200 text-sm font-semibold mb-4">Distribución de Gastos</p>
                <canvas id="graficoCategorias" height="250"></canvas>
            </div>
            <div id="lista-presupuestos" class="space-y-4"></div>
        </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav class="shrink-0 w-full bg-slate-950 border-t border-slate-800 flex justify-around items-center h-[65px]">
        <button onclick="cambiarTab('captura')" id="tab-captura" class="flex flex-col items-center justify-center w-full h-full tab-activa transition-colors">
            <span class="text-xl mb-1">⌨️</span>
            <span class="text-[10px] font-bold">Ingresar</span>
        </button>
        <button onclick="cambiarTab('dashboard')" id="tab-dashboard" class="flex flex-col items-center justify-center w-full h-full tab-inactiva transition-colors">
            <span class="text-xl mb-1">📊</span>
            <span class="text-[10px] font-bold">Reportes</span>
        </button>
    </nav>

    <script>
        const db = supabase.createClient(
            'https://znszebnjcgjfzxvnexxd.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpuc3plYm5qY2dqZnp4dm5leHhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NzkwNzcsImV4cCI6MjEwNTQ1NTA3N30.Od66KMiiuXPrzAUfuiprc7Q7SF3909lxDeBevMK25h0'
        );

        const formateador = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
        let monto = '0';
        let graficoInstancia = null;
        let categoriaPendiente = null;
        
        let tipoActual = 'gasto';
        let cuentaActual = 'Nequi';
        const listaCuentas = ['Nequi', 'Efectivo', 'Bancolombia'];
        let cuentaIndex = 0;

        document.getElementById('fecha-actual').textContent = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'short' }).format(new Date());

        function cambiarCuenta() {
            cuentaIndex = (cuentaIndex + 1) % listaCuentas.length;
            cuentaActual = listaCuentas[cuentaIndex];
            document.getElementById('btn-cuenta').textContent = cuentaActual;
        }

        function cambiarTipoTransaccion(tipo) {
            tipoActual = tipo;
            const btnGasto = document.getElementById('btn-tipo-gasto');
            const btnIngreso = document.getElementById('btn-tipo-ingreso');
            const display = document.getElementById('monto-display');
            
            if (tipo === 'gasto') {
                btnGasto.className = 'bg-slate-600 text-white px-4 py-1 rounded-lg text-xs font-bold transition-all shadow-md';
                btnIngreso.className = 'text-slate-400 px-4 py-1 rounded-lg text-xs font-bold transition-all';
                display.classList.remove('text-emerald-400');
                display.classList.add('text-white');
            } else {
                btnIngreso.className = 'bg-emerald-600 text-white px-4 py-1 rounded-lg text-xs font-bold transition-all shadow-md';
                btnGasto.className = 'text-slate-400 px-4 py-1 rounded-lg text-xs font-bold transition-all';
                display.classList.remove('text-white');
                display.classList.add('text-emerald-400');
            }
            cargarCategorias(); 
        }

        function actualizarPantalla() { document.getElementById('monto-display').textContent = formateador.format(parseInt(monto || '0')); }
        function digitar(num) { if (monto === '0' || monto === 0) monto = num; else if (monto.length < 10) monto += num; actualizarPantalla(); }
        function borrar() { monto = monto.slice(0, -1); if (monto === '') monto = '0'; actualizarPantalla(); }
        function limpiar() { monto = '0'; actualizarPantalla(); }

        function cambiarTab(pantalla) {
            const captura = document.getElementById('pantalla-captura');
            const dashboard = document.getElementById('pantalla-dashboard');
            const tabCap = document.getElementById('tab-captura');
            const tabDash = document.getElementById('tab-dashboard');

            if (pantalla === 'captura') {
                captura.classList.remove('hidden'); captura.classList.add('flex');
                dashboard.classList.add('hidden'); dashboard.classList.remove('flex');
                tabCap.classList.replace('tab-inactiva', 'tab-activa'); tabDash.classList.replace('tab-activa', 'tab-inactiva');
            } else {
                dashboard.classList.remove('hidden'); dashboard.classList.add('flex');
                captura.classList.add('hidden'); captura.classList.remove('flex');
                tabDash.classList.replace('tab-inactiva', 'tab-activa'); tabCap.classList.replace('tab-activa', 'tab-inactiva');
                cargarEstadisticas();
            }
        }

        function abrirModal(catId) {
            categoriaPendiente = catId;
            const modal = document.getElementById('modal-notas');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('input-notas').focus();
        }

        function cerrarModal() {
            const modal = document.getElementById('modal-notas');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('input-notas').value = '';
            categoriaPendiente = null;
        }

        function confirmarOtrosGastos() {
            const nota = document.getElementById('input-notas').value.trim();
            guardarTransaccion(categoriaPendiente, nota);
            cerrarModal();
        }

        function renderizarGraficoDonut(labels, data) {
            const ctx = document.getElementById('graficoCategorias').getContext('2d');
            if (graficoInstancia) graficoInstancia.destroy();
            graficoInstancia = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#c084fc', '#a3e635', '#f472b6', '#38bdf8', '#a78bfa', '#fb923c', '#4ade80', '#94a3b8'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: { 
                    responsive: true, 
                    cutout: '75%', 
                    plugins: { 
                        legend: { position: 'right', labels: { color: '#cbd5e1', font: { size: 9 } } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let total = context.chart._metasets[context.datasetIndex].total;
                                    let valor = context.raw;
                                    let porcentaje = Math.round((valor / total) * 100);
                                    return ` ${context.label}: ${formateador.format(valor)} (${porcentaje}%)`;
                                }
                            }
                        }
                    } 
                }
            });
        }

        async function guardarTransaccion(categoriaId, notaGasto) {
            const valorGasto = parseInt(monto);
            if (valorGasto === 0) return;

            const payload = { 
                monto: valorGasto, 
                categoria_id: categoriaId, 
                cuenta: cuentaActual, 
                fecha: new Date().toISOString(),
                notas: notaGasto || null 
            };
            
            const display = document.getElementById('monto-display');

            if (navigator.onLine) {
                const { error } = await db.from('transacciones').insert([payload]);
                if (error) {
                    display.style.color = '#ef4444'; 
                    setTimeout(() => display.style.color = tipoActual === 'gasto' ? 'white' : '#34d399', 1000);
                    return;
                }
            } else {
                let queue = JSON.parse(localStorage.getItem('offline_queue') || '[]');
                queue.push(payload);
                localStorage.setItem('offline_queue', JSON.stringify(queue));
            }
            
            if (navigator.vibrate) navigator.vibrate(50);
            display.style.color = '#34d399'; 
            setTimeout(() => display.style.color = tipoActual === 'gasto' ? 'white' : '#34d399', 300);
            limpiar();
        }

        async function eliminarTransaccion(id) {
            if(!confirm("¿Borrar esta transacción?")) return;
            const { error } = await db.from('transacciones').delete().eq('id', id);
            if(!error) cargarEstadisticas();
        }

        async function cargarEstadisticas() {
            const filtro = document.getElementById('filtro-tiempo').value;
            const fecha = new Date();
            let fechaFiltro;
            
            if (filtro === 'dia') {
                fechaFiltro = `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}-${String(fecha.getDate()).padStart(2, '0')}`;
            } else if (filtro === 'anio') {
                fechaFiltro = `${fecha.getFullYear()}-01-01`;
            } else {
                fechaFiltro = `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}-01`;
            }

            const { data: categorias, error: errCat } = await db.from('categorias').select('*');
            const { data: transacciones, error: errTrans } = await db.from('transacciones').select('*').gte('fecha', fechaFiltro).order('fecha', { ascending: false });
            
            if (errCat || errTrans) {
                console.error("Error BD:", errCat, errTrans);
                return;
            }

            let totalGastadoMes = 0;
            let totalIngresadoMes = 0;
            const reporteGastos = {};
            const mapaCat = {};
            
            categorias.forEach(c => { 
                mapaCat[c.id] = c;
                if(c.tipo === 'gasto') reporteGastos[c.id] = { nombre: c.nombre, presupuesto: parseFloat(c.presupuesto_mensual) || 0, gastado: 0 }; 
            });

            const contenedorHistorial = document.getElementById('historial-transacciones');
            contenedorHistorial.innerHTML = '';

            if(transacciones.length === 0) {
                contenedorHistorial.innerHTML = '<p class="text-slate-500 text-xs text-center">No hay registros</p>';
            }

            transacciones.forEach((t, index) => {
                const cat = mapaCat[t.categoria_id];
                if (!cat) return;
                const valor = parseFloat(t.monto);
                const isIngreso = cat.tipo === 'ingreso';

                if (isIngreso) {
                    totalIngresadoMes += valor;
                } else if (cat.tipo === 'gasto') {
                    totalGastadoMes += valor;
                    if(reporteGastos[t.categoria_id]) reporteGastos[t.categoria_id].gastado += valor;
                }

                // Generar UI del Historial (limitado a 15 para no saturar)
                if (index < 15) {
                    const fila = document.createElement('div');
                    fila.className = "flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-700/50";
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = "flex flex-col";
                    
                    const catSpan = document.createElement('span');
                    catSpan.className = "text-sm font-bold text-white";
                    catSpan.textContent = cat.nombre;
                    
                    const notaSpan = document.createElement('span');
                    notaSpan.className = "text-xs text-slate-500";
                    notaSpan.textContent = t.notas ? t.notas : (isIngreso ? 'Ingreso' : 'Gasto');
                    
                    infoDiv.appendChild(catSpan);
                    infoDiv.appendChild(notaSpan);
                    
                    const valDiv = document.createElement('div');
                    valDiv.className = "flex items-center gap-3";
                    
                    const montoSpan = document.createElement('span');
                    montoSpan.className = `text-sm font-bold ${isIngreso ? 'text-emerald-400' : 'text-red-400'}`;
                    montoSpan.textContent = `${isIngreso ? '+' : '-'}${formateador.format(valor)}`;
                    
                    const btnBorrar = document.createElement('button');
                    btnBorrar.className = "text-slate-500 hover:text-red-400 text-lg transition-colors p-1 active:scale-90";
                    btnBorrar.innerHTML = "🗑️";
                    btnBorrar.onclick = () => eliminarTransaccion(t.id);
                    
                    valDiv.appendChild(montoSpan);
                    valDiv.appendChild(btnBorrar);
                    fila.appendChild(infoDiv);
                    fila.appendChild(valDiv);
                    contenedorHistorial.appendChild(fila);
                }
            });

            const balanceReal = totalIngresadoMes - totalGastadoMes;

            document.getElementById('dash-ingresos').textContent = formateador.format(totalIngresadoMes);
            document.getElementById('dash-gastos').textContent = formateador.format(totalGastadoMes);
            document.getElementById('dash-balance').textContent = formateador.format(balanceReal);

            const labelsGrafico = [];
            const dataGrafico = [];
            const contenedorLista = document.getElementById('lista-presupuestos');
            contenedorLista.innerHTML = '';

            if (totalGastadoMes === 0) {
                renderizarGraficoDonut(['Sin datos'], [1]);
                return;
            }

            Object.values(reporteGastos).sort((a,b) => b.gastado - a.gastado).forEach(item => {
                if (item.gastado > 0) { labelsGrafico.push(item.nombre); dataGrafico.push(item.gastado); }
                const porcentaje = item.presupuesto > 0 ? Math.min((item.gastado / item.presupuesto) * 100, 100).toFixed(0) : 0;
                const colorBarra = porcentaje > 90 ? 'bg-red-500' : (porcentaje > 70 ? 'bg-yellow-400' : 'bg-emerald-400');

                if (item.gastado > 0 || item.presupuesto > 0) {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 mb-4";

                    const cabecera = document.createElement('div');
                    cabecera.className = "flex justify-between items-end mb-2";

                    const nombreSpan = document.createElement('span');
                    nombreSpan.className = "font-bold text-white uppercase text-xs tracking-wider";
                    nombreSpan.textContent = item.nombre;

                    const valoresSpan = document.createElement('span');
                    valoresSpan.className = "text-xs text-slate-400";
                    valoresSpan.textContent = `${formateador.format(item.gastado)} de ${formateador.format(item.presupuesto)}`;

                    cabecera.appendChild(nombreSpan);
                    cabecera.appendChild(valoresSpan);

                    const contenedorBarra = document.createElement('div');
                    contenedorBarra.className = "w-full bg-slate-900 rounded-full h-2.5";

                    const barra = document.createElement('div');
                    barra.className = `${colorBarra} h-2.5 rounded-full transition-all duration-1000`;
                    barra.style.width = `${porcentaje}%`;

                    contenedorBarra.appendChild(barra);
                    tarjeta.appendChild(cabecera);
                    tarjeta.appendChild(contenedorBarra);

                    contenedorLista.appendChild(tarjeta);
                }
            });

            renderizarGraficoDonut(labelsGrafico, dataGrafico);
        }

        async function cargarCategorias() {
            const { data, error } = await db.from('categorias').select('*').eq('tipo', tipoActual).order('nombre');
            if (error) {
                console.error("Error BD:", error);
                return;
            }
            
            const contenedor = document.getElementById('categorias-container');
            contenedor.innerHTML = '';
            
            data.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "flex flex-col items-center justify-center py-2 bg-slate-800 rounded-xl active:bg-emerald-600 active:scale-95 transition-all border border-slate-700 min-h-[70px]";
                
                const spanIcono = document.createElement('span');
                spanIcono.className = "text-xl mb-1";
                spanIcono.textContent = cat.icono;
                
                const spanNombre = document.createElement('span');
                spanNombre.className = "text-[8px] font-bold text-slate-300 uppercase tracking-wider text-center px-1 leading-tight";
                spanNombre.textContent = cat.nombre;
                
                btn.appendChild(spanIcono);
                btn.appendChild(spanNombre);
                
                btn.onclick = () => {
                    if (parseInt(monto) > 0) {
                        if (cat.nombre.toUpperCase().includes('OTROS') || cat.nombre.toUpperCase().includes('EXTRA')) {
                            abrirModal(cat.id);
                        } else {
                            guardarTransaccion(cat.id, '');
                        }
                    }
                };
                contenedor.appendChild(btn);
            });
        }

        async function autorizarDispositivo() {
            const { data: { session } } = await db.auth.getSession();
            
            if (!session) {
                const email = prompt("🔐 Base de datos bloqueada (RLS). Ingresa tu correo de administrador:");
                if (!email) return;
                
                const password = prompt("Ingresa tu contraseña de Supabase:");
                if (!password) return;

                const { error } = await db.auth.signInWithPassword({ email, password });
                
                if (error) {
                    alert("❌ Acceso denegado: " + error.message);
                    return; 
                } else {
                    alert("✅ Dispositivo autorizado.");
                }
            }
            
            cargarCategorias();
        }

        async function procesarColaOffline() {
            let queue = JSON.parse(localStorage.getItem('offline_queue') || '[]');
            if (queue.length === 0) return;

            const { error } = await db.from('transacciones').insert(queue);
            
            if (!error) {
                localStorage.removeItem('offline_queue');
                console.log(`Sincronizadas ${queue.length} transacciones pendientes.`);
                if (!document.getElementById('pantalla-dashboard').classList.contains('hidden')) {
                    cargarEstadisticas();
                }
            }
        }

        // --- ARRANQUE ---
        window.addEventListener('online', procesarColaOffline);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        if (navigator.onLine) procesarColaOffline();
        
        autorizarDispositivo();

    </script>
</body>
</html>
